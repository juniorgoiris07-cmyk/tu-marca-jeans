backend:
  name: git-gateway
  branch: main

# Esto hace que "Publicar" en el panel guarde los cambios directo en el
# sitio (no queda una versión "borrador" pendiente de aprobar).
publish_mode: simple

media_folder: "images"
public_folder: "images"

collections:
  - name: "productos"
    label: "Catálogo de productos"
    label_singular: "Producto"
    folder: "content/productos"
    create: true
    delete: true
    slug: "{{fields.id}}"
    identifier_field: "nombre"
    summary: "{{fields.nombre}} — {{fields.categoria}} — Gs. {{fields.precio}}"
    sortable_fields: ["orden", "nombre", "precio"]
    view_filters:
      - label: "Sin stock"
        field: stock
        pattern: "false"
      - label: "En oferta"
        field: enOferta
        pattern: "true"
    fields:
      - { label: "ID interno (sin espacios ni tildes, ej. mom-fit-2)", name: "id", widget: "string", hint: "No se puede cambiar después de crear el producto." }
      - { label: "Nombre del modelo", name: "nombre", widget: "string" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Hombre", value: "hombre" }
          - { label: "Mujer", value: "mujer" }
          - { label: "Unisex", value: "unisex" }
      - { label: "Color / detalle", name: "color", widget: "string" }
      - { label: "Talles (ej. 38 – 46)", name: "talles", widget: "string" }
      - { label: "Precio normal (Gs.)", name: "precio", widget: "number", value_type: "int", min: 0 }
      - { label: "¿Está en oferta ahora?", name: "enOferta", widget: "boolean", default: false }
      - { label: "Precio con oferta (Gs.) — solo si está en oferta", name: "precioOferta", widget: "number", value_type: "int", min: 0, required: false }
      - { label: "¿Hay stock disponible?", name: "stock", widget: "boolean", default: true }
      - { label: "Foto del producto", name: "imagen", widget: "image" }
      - { label: "Orden de aparición (menor número = aparece primero)", name: "orden", widget: "number", value_type: "int", default: 100 }
